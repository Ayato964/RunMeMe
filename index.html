<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run Me Me</title>
</head>

<body class="bg-gray-900 text-white overflow-hidden select-none">
  <div id="app" class="relative w-full h-full">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" class="block w-full h-full"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4">
      <!-- HUD -->
      <div class="flex justify-between items-start">
      </div>

      <!-- Start Screen -->
      <div id="start-screen"
        class="absolute inset-0 flex flex-col items-center justify-end pb-12 bg-cover bg-center bg-no-repeat pointer-events-auto z-50"
        style="background-image: url('/assets/title.png');">
        
        <!-- User Status Badge (shown when authenticated) -->
        <div id="user-badge" class="hidden absolute top-6 right-6 flex items-center gap-3 bg-white/90 border-4 border-black rounded-2xl px-4 py-2 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transform rotate-1">
          <img id="user-avatar" src="assets/chara_stop.png" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-black object-cover" />
          <div class="flex flex-col text-left">
            <div class="flex items-center gap-1.5">
              <span id="user-display-name" class="font-black text-black text-sm tracking-wide">Player</span>
              <span id="ambassador-tag" class="hidden px-1.5 py-0.5 bg-yellow-400 border border-black rounded text-[10px] font-black text-black">✦ AMBASSADOR</span>
            </div>
            <span id="user-discord-id" class="text-xs font-bold text-gray-500 font-mono">@guest</span>
          </div>
          <button id="logout-btn" title="ログアウト / アカウント切り替え" class="ml-2 px-2 py-1 bg-gray-200 hover:bg-red-400 hover:text-white border-2 border-black rounded-lg text-xs font-black text-black transition-colors">
            LOGOUT
          </button>
        </div>

        <div class="text-center w-full max-w-xl px-4">
          <!-- Auth Gate Screen (shown before game start / ranking) -->
          <div id="auth-gate-container" class="mb-4 bg-white/95 border-4 border-black rounded-3xl p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transform -rotate-1">
            <h2 class="text-3xl font-black text-black tracking-wider mb-2 drop-shadow-[2px_2px_0_#fde047]">RUN ME ME LOGIN</h2>
            <p class="text-sm font-bold text-gray-600 mb-6">Moffy アカウントと連携してクラウドに記録を保存しよう！</p>
            
            <div class="flex flex-col gap-4 items-center">
              <button id="link-account-btn"
                class="w-full max-w-md transform hover:scale-105 transition-transform duration-200 py-4 px-6 bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 border-4 border-black rounded-2xl text-xl font-black text-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center gap-2 -skew-x-3 cursor-pointer">
                <span class="text-yellow-300 text-2xl">✦</span>
                <span>アカウントを連携する</span>
              </button>
              
              <button id="guest-login-btn"
                class="w-full max-w-md transform hover:scale-105 transition-transform duration-200 py-3 px-6 bg-yellow-400 hover:bg-yellow-300 border-4 border-black rounded-2xl text-base font-black text-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] skew-x-3 cursor-pointer">
                ゲストとしてログイン
              </button>
            </div>
          </div>

          <!-- Original Game Start Controls (hidden until auth or guest login) -->
          <div id="start-controls-container" class="hidden">
            <div class="mb-6 transform -skew-x-12">
              <input type="text" id="player-name-input" placeholder="ENTER NAME"
                class="px-6 py-3 rounded-xl border-4 border-black bg-white text-black font-black text-2xl text-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:outline-none uppercase tracking-wider"
                value="Player" maxlength="15">
            </div>

            <div class="flex gap-6 justify-center items-center">
              <button id="start-btn"
                class="transform hover:scale-110 transition-transform duration-200 px-10 py-4 bg-yellow-400 border-4 border-black rounded-xl text-2xl font-black text-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] -skew-x-6 cursor-pointer">
                START GAME
              </button>
              <button id="rankings-btn-start"
                class="transform hover:scale-110 transition-transform duration-200 px-8 py-4 bg-pink-400 border-4 border-black rounded-xl text-2xl font-black text-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] skew-x-6 cursor-pointer">
                RANKING
              </button>
            </div>
            <p class="mt-8 text-xl text-white font-bold drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] animate-pulse">PRESS SPACE
              TO JUMP</p>
          </div>
          
          <div class="absolute bottom-4 right-4 text-white/50 font-mono text-sm">Ver 2.0.0</div>
        </div>
      </div>

      <!-- Rankings Screen -->
      <div id="rankings-screen"
        class="hidden absolute inset-0 flex items-center justify-center bg-black/85 pointer-events-auto z-50 backdrop-blur-sm overflow-y-auto p-4">
        <div class="w-full max-w-3xl flex flex-col items-center justify-center my-auto">
          <!-- Ranking Header -->
          <div id="rankings-header-container" class="text-center mb-4">
            <h2 id="rankings-title" class="text-5xl sm:text-6xl font-black text-yellow-400 drop-shadow-[4px_4px_0_#000] transform -rotate-2 tracking-wider">
              RANKING
            </h2>
            <div id="rankings-subtitle" class="hidden text-2xl sm:text-3xl font-bold text-white mt-1 drop-shadow-[2px_2px_0_#000]"></div>
          </div>

          <!-- Category Switcher Tabs -->
          <div class="flex gap-2 sm:gap-4 mb-3 justify-center items-center w-full max-w-md">
            <button id="rankings-tab-mybest"
              class="flex-1 py-2 sm:py-2.5 px-2 bg-yellow-400 border-4 border-black rounded-xl text-base sm:text-lg font-black text-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
              MY BEST
            </button>
            <button id="rankings-tab-global"
              class="flex-1 py-2 sm:py-2.5 px-2 bg-white/80 border-4 border-black rounded-xl text-base sm:text-lg font-black text-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] transition-all hover:bg-white hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
              GLOBAL
            </button>
            <button id="rankings-tab-weekly"
              class="flex-1 py-2 sm:py-2.5 px-2 bg-white/80 border-4 border-black rounded-xl text-base sm:text-lg font-black text-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] transition-all hover:bg-white hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
              WEEKLY
            </button>
          </div>

          <!-- Category Notice -->
          <div id="rankings-category-notice" class="text-xs sm:text-sm font-bold text-gray-300 mb-3 tracking-wide text-center">
            TOP 3 PERSONAL RECORDS
          </div>

          <!-- Content injected by UIManager -->
          <div id="rankings-list" class="w-full max-h-[50vh] overflow-y-auto px-1 sm:px-3 text-center">
            <!-- List goes here -->
          </div>

          <button id="close-rankings-btn"
            class="mt-6 px-8 py-3 bg-red-500 border-4 border-black rounded-full text-white font-black text-xl sm:text-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:scale-105 active:scale-95 transition-transform cursor-pointer">
            CLOSE
          </button>
        </div>
      </div>

      <!-- Game Over Screen -->
      <!-- Game Over Screen -->
      <div id="game-over-screen"
        class="hidden absolute inset-0 flex items-center justify-center bg-black/90 pointer-events-auto z-50 overflow-y-auto">
        <div class="flex flex-col lg:flex-row items-center justify-center w-full max-w-6xl p-4 gap-8">

          <!-- Left: Character and Speech Bubble -->
          <div class="flex flex-col items-center justify-center relative w-full lg:w-1/2 h-[300px] lg:h-[500px]">
            <!-- Character Image -->
            <img src="assets/chara_stop.png" alt="Character" class="h-64 lg:h-96 object-contain z-10" />

            <!-- Speech Bubble -->
            <div id="game-over-message"
              class="absolute top-10 right-10 lg:right-0 bg-white text-black p-6 rounded-[2rem] rounded-bl-none text-xl lg:text-2xl font-bold border-4 border-black shadow-[8px_8px_0_rgba(0,0,0,0.5)] max-w-[200px] transform rotate-2 animate-bounce">
              Don't give up!
            </div>
          </div>

          <!-- Right: Result Stats -->
          <div class="flex flex-col w-full lg:w-1/2 gap-6">
            <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 lg:p-8 border-4 border-white/20 w-full shadow-2xl">
              <h2 class="text-5xl lg:text-6xl font-black text-center mb-6 text-red-500 drop-shadow-[4px_4px_0_#000]">
                GAME OVER</h2>

              <div class="grid grid-cols-2 gap-4 text-center">
                <!-- Base Score -->
                <div class="bg-black/40 rounded-xl p-3">
                  <div class="text-gray-400 text-xs font-bold uppercase">Base Score</div>
                  <div id="base-score" class="text-2xl font-mono text-white">0</div>
                </div>

                <!-- Level -->
                <div class="bg-black/40 rounded-xl p-3">
                  <div class="text-gray-400 text-xs font-bold uppercase">Level reached</div>
                  <div id="result-level" class="text-2xl font-mono text-yellow-400">1</div>
                </div>

                <!-- Max Speed -->
                <div class="bg-black/40 rounded-xl p-3 col-span-2">
                  <div class="text-gray-400 text-xs font-bold uppercase">Max Speed</div>
                  <div id="result-max-speed" class="text-2xl font-mono text-blue-400">1.00x</div>
                </div>

                <!-- Items -->
                <div class="bg-black/40 rounded-xl p-3 col-span-2">
                  <div class="text-gray-400 text-xs font-bold uppercase mb-2">Items Collected</div>
                  <div class="flex justify-center gap-6">
                    <div class="flex flex-col items-center">
                      <img src="assets/onigiri.png" class="w-8 h-8 mb-1" />
                      <span id="count-onigiri" class="font-mono text-lg">0</span>
                    </div>
                    <div class="flex flex-col items-center">
                      <img src="assets/icecream.png" class="w-8 h-8 mb-1" />
                      <span id="count-icecream" class="font-mono text-lg">0</span>
                    </div>
                    <div class="flex flex-col items-center">
                      <img src="assets/star.png" class="w-8 h-8 mb-1" />
                      <span id="count-star" class="font-mono text-lg">0</span>
                    </div>
                  </div>
                </div>

                <!-- Star Bonus -->
                <div class="bg-black/40 rounded-xl p-3 col-span-2 flex justify-between items-center px-6">
                  <div class="text-left">
                    <div class="text-gray-400 text-xs font-bold uppercase">Star Bonus</div>
                    <div class="text-xs text-gray-500">Double Jumps x 200</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span id="star-count" class="text-xl font-mono text-yellow-400">0</span>
                    <span id="star-bonus" class="text-xl font-mono text-green-400">+0</span>
                  </div>
                </div>

                <!-- Final Score -->
                <div
                  class="col-span-2 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl p-4 border-4 border-white/50 transform scale-105 shadow-xl mt-2">
                  <div class="text-white/80 text-sm font-bold mb-1 tracking-widest uppercase">Final Score</div>
                  <div id="final-score"
                    class="text-5xl lg:text-6xl font-black text-white drop-shadow-[4px_4px_0_rgba(0,0,0,0.5)]">0
                  </div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
              <button id="rankings-btn-gameover"
                class="bg-yellow-400 hover:bg-yellow-500 text-black font-black py-4 px-8 rounded-xl text-xl shadow-[6px_6px_0_#000] transform transition hover:-translate-y-1 active:translate-y-0 border-4 border-black text-center">
                view RANKING
              </button>
              <button id="return-title-btn"
                class="hidden bg-blue-500 hover:bg-blue-600 text-white font-black py-4 px-8 rounded-xl text-xl shadow-[6px_6px_0_#000] transform transition hover:-translate-y-1 active:translate-y-0 border-4 border-black text-center">
                back to TITLE
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Controls -->
      <div id="mobile-controls" class="hidden absolute bottom-8 right-8 pointer-events-auto">
        <button id="mobile-jump-btn"
          class="w-24 h-24 bg-white/20 rounded-full border-4 border-white/50 backdrop-blur-sm active:bg-white/40 flex items-center justify-center">
          <span class="text-white font-bold">JUMP</span>
        </button>
      </div>

      <!-- Loading Screen -->
      <div id="loading-screen"
        class="absolute inset-0 bg-[#fef3c7] flex flex-col items-center justify-center z-[100] transition-opacity duration-500">
        <div class="relative w-32 h-32 mb-8">
          <img id="loading-chara" src="assets/chara_run_1.png" class="w-full h-full object-contain" />
        </div>
        <div class="text-4xl font-black text-black tracking-widest animate-pulse">
          LOADING...
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
