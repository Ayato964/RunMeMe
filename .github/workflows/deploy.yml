name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_MOFFY_API_KEY: ${{ secrets.VITE_MOFFY_API_KEY }}
          VITE_MOFFY_API_BASE_URL: https://moffy-profile-287701603412.asia-northeast1.run.app
          VITE_AUTH_URL: https://googleaistudentambassador.github.io/IdentityLogInsystem/oauth.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
